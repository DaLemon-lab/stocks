<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><title>Stocks World</title>
<style>

body{background:var(--bg);color:var(--t);font:14px -apple-system,"SF Pro Text",Helvetica,Arial,sans-serif;overflow:hidden}
button,input{font:inherit;color:var(--t)}button{background:var(--l);border:0;border-radius:8px;padding:8px 14px;cursor:pointer}button:hover{filter:brightness(1.25)}
button.on{background:#5a5a5e}input[type=text],input[type=number]{background:#111;border:1px solid var(--l);border-radius:8px;padding:9px 12px;width:100%}
.scr{display:none;height:100%;flex-direction:column;align-items:center;justify-content:center;gap:14px;padding:20px}.scr.show{display:flex}

@media(max-width:700px){#world.show{flex-direction:column}#side{width:100%;height:34%}}
</style></head><body>
<div id="menu" class="scr show"><div style="position:absolute;top:calc(14px + env(safe-area-inset-top,0px));right:16px;display:flex;gap:8px;align-items:center"><span class="m" id="mn"></span><span id="ma"></span></div>
<h1>Stocks</h1><div class="card"><button class="big" onclick="go('wsel')">Create world</button><button class="big" onclick="go('prof')">Profile</button></div></div>
<div id="wsel" class="scr"><div class="card"><h2>Worlds</h2><div id="sv" style="display:flex;flex-direction:column;gap:8px"></div><button class="big" onclick="go('wnew')">Create world</button><button class="big" onclick="go('wjoin')">Join world</button><button onclick="go('menu')">Back</button></div></div>
<div id="wnew" class="scr"><div class="card"><h2>Create world</h2><input type="text" id="wname" placeholder="World name" maxlength="30"><button class="big buy" onclick="createW()">Create</button><div class="r" id="e1"></div><button onclick="go('wsel')">Back</button></div></div>

<div id="prof" class="scr"><div class="card"><h2>Profile</h2><div id="pa" style="align-self:center"></div><input type="text" id="pn" placeholder="New name" maxlength="20"><button onclick="saveName()">Change name</button><label class="m">Change profile: picture or video</label><input type="file" id="pf" accept="image/*,video/*"><div class="r" id="e3"></div><button onclick="go('menu')">Back</button></div></div>
<div id="world"><div id="side"><div class="top"><button onclick="leave()">‹</button><input type="text" id="q" placeholder="Search" oninput="rList()"></div><div id="list"></div></div>
<div id="main"><div class="bar" id="top"></div><div id="peers" class="tabs"></div>
<div id="sel" class="m">Select a stock from the list to start trading.</div>
<div id="sd" style="display:none;flex-direction:column;gap:10px"><div class="sym"><h1 id="s1"></h1><span class="m" id="s2"></span><div class="pr"><b id="s3"></b> <span id="s4"></span></div></div>
<div class="tabs" id="rg"></div><div id="cw"><canvas id="cv"></canvas><canvas id="dv"></canvas><div id="cu"></div></div>
<div class="tabs"><span class="m" style="padding:5px">Draw:</span><button id="bp" onclick="tl('pen')">✎ Pen</button><button id="be" onclick="tl('erase')">⌫ Erase</button><button onclick="clr()">Clear mine</button></div>
<div class="stats" id="st"></div>
<div class="trade"><input type="number" id="qty" min="1" value="1"><button class="buy" onclick="trade('b')">Buy</button><button class="sell" onclick="trade('s')">Sell</button><button class="sell" onclick="sh('x')" title="Bet the price goes down">Short (bet down)</button><button class="buy" onclick="sh('c')">Cover short</button><button onclick="sellAll()">Sell all</button><button onclick="sellAll(1)">Sell everything</button><span id="tm" class="m"></span></div></div></div></div>
<script>

async function init(){head();try{db=await claude.use('db');R=await claude.use('room');const u=await claude.use('user');if(u){const i=await u.id();if(i)myId=i}}catch(e){}}
init();
const rc=()=>{const a='ABCDEFGHJKLMNPQRSTUVWXYZ23456789';let s='';for(let i=0;i<5;i++)s+=a[Math.floor(Math.random()*a.length)];return s};
async function createW(){const n=$('#wname').value.trim();if(!n){$('#e1').textContent='Pick a name first.';return}if(!db){$('#e1').textContent='Multiplayer needs you to be signed in to claude.ai.';return}
try{const c=rc();await db.doc('worlds/'+c).set({name:n,created:Date.now(),cash:100000,h:{}});enter(c)}catch(e){$('#e1').textContent='Could not create world.'}}
async function joinW(){const c=$('#jcode').value.trim().toUpperCase();if(!db){$('#e2').textContent='Multiplayer needs you to be signed in to claude.ai.';return}
try{const s=await db.doc('worlds/'+c).get();if(!c||!s.exists){$('#e2').textContent='No world with that code.';return}enter(c)}catch(e){$('#e2').textContent='Could not join.'}}

function rList(){if(!world)return;const q=$('#q').value.toLowerCase(),k=tick();$('#list').innerHTML=ST.filter(s=>!q||s.y.toLowerCase().includes(q)||s.n.toLowerCase().includes(q)).map(s=>{const p=px(s,k),c=p-px(s,k-100);return`<div class="row ${cur==s?'sel':''}" onclick="pick('${s.y}')"><div><b>${(world.h[s.y]||world.sh[s.y])?'<span style="color:#ffd60a">● </span>':''}${s.y}</b><div class="m">${s.n}</div></div><div style="text-align:right"><b>${f(p)}</b><div class="${c>=0?'g':'r'}">${c>=0?'+':''}${f(c)}</div></div></div>`}).join('')}
function pick(y){cur=ST.find(s=>s.y==y);strokes=[];unD&&unD();ddoc=wref.collection('draw').doc(y);unD=ddoc.onSnapshot(s=>{if(busy)return;strokes=(s.data()||{}).s||[];dl()});$('#sel').style.display='none';$('#sd').style.display='flex';$('#s1').textContent=y;$('#s2').textContent=cur.n;rg();rList();pres();chart();rPeers();info()}
function rg(){const R=[[20,'1m'],[100,'5m'],[300,'15m'],[1e9,'ALL']];$('#rg').innerHTML=R.map(r=>`<button class="${range==r[0]?'on':''}" onclick="range=${r[0]};rg();chart()">${r[1]}</button>`).join('')}
function chart(){if(!cur||!world)return;const k=tick();px(cur,k);const n=Math.min(range,k),d=cur.a.slice(k-n,k+1),c=$('#cv'),v=$('#dv'),w=c.clientWidth,h=c.clientHeight,r=devicePixelRatio||1;
if(c.width!==Math.round(w*r)||c.height!==Math.round(h*r)){c.width=v.width=Math.round(w*r);c.height=v.height=Math.round(h*r);dl()}
const x=c.getContext('2d');x.setTransform(r,0,0,r,0,0);x.clearRect(0,0,w,h);const lh=world.h[cur.y],ls=world.sh[cur.y],ev=[lh&&lh.c,ls&&ls.c].filter(Boolean),lo=Math.min(...d),hi=Math.max(...d),l2=Math.min(lo,...ev),h2=Math.max(hi,...ev),pd=(h2-l2)*.12||1,a=l2-pd,b=h2+pd,W=w-52,Y=p=>h-8-(p-a)/(b-a)*(h-16),up=d[d.length-1]>=d[0],col=up?'#6fd36f':'#ff5e57';
x.strokeStyle='#ffffff18';x.fillStyle='#8e8e93';x.font='11px sans-serif';x.lineWidth=1;for(let i=0;i<5;i++){const p=a+(b-a)*i/4,y=Y(p);x.beginPath();x.moveTo(0,y);x.lineTo(W,y);x.stroke();x.fillText(p.toFixed(2),W+6,y+4)}
[[lh,'#ffd60a','Bought at '],[ls,'#ff9f0a','Shorted at ']].forEach(([e,c,t])=>{if(!e)return;const y=Y(e.c);x.save();x.setLineDash([6,4]);x.strokeStyle=c;x.lineWidth=1.3;x.beginPath();x.moveTo(0,y);x.lineTo(W,y);x.stroke();x.restore();x.fillStyle=c;x.fillText(t+f(e.c),6,y-5)});x.beginPath();d.forEach((p,i)=>{const X=i/(d.length-1||1)*W;i?x.lineTo(X,Y(p)):x.moveTo(X,Y(p))});x.strokeStyle=col;x.lineWidth=1.6;x.stroke();x.lineTo(W,h);x.lineTo(0,h);const g=x.createLinearGradient(0,0,0,h);g.addColorStop(0,col+'55');g.addColorStop(1,col+'00');x.fillStyle=g;x.fill();

const o=world.h[cur.y]||{q:0,c:0};$('#st').innerHTML=`<div>Open<b>${f(d[0])}</b></div><div>High<b>${f(hi)}</b></div><div>Low<b>${f(lo)}</b></div><div>Owned<b>${o.q}</b></div><div>Avg cost<b>${o.q?f(o.c):'–'}</b></div><div>Position<b>$${f(o.q*p)}</b></div><div>Short shares<b>${world.sh[cur.y]?world.sh[cur.y].q:0}</b></div>`}

if(s=='x'){if(p*q>cash+1e-6)return m('Not enough cash for collateral.');cash-=p*q;S[y]={q:e.q+q,c:(e.c*e.q+p*q)/(e.q+q)};m(`Shorted ${q} at $${f(p)}. You earn money if it drops.`)}

function sellAll(all){if(!world)return;const ys=all?[...new Set([...Object.keys(world.h),...Object.keys(world.sh)])]:cur?[cur.y]:[];let cash=world.cash,h={...world.h},S={...world.sh},n=0;ys.forEach(y=>{const st=ST.find(s=>s.y==y),p=pr(st);if(h[y]){cash+=h[y].q*p;delete h[y];n++}if(S[y]){cash+=Math.max(0,S[y].q*(2*S[y].c-p));delete S[y];n++}});$('#tm').textContent=n?(all?'Sold everything.':'Sold all of '+cur.y+'.'):'Nothing to sell.';world={...world,h,sh:S,cash};commit()}
/* drawing */
function tl(t){tool=tool==t?'none':t;$('#bp').classList.toggle('on',tool=='pen');$('#be').classList.toggle('on',tool=='erase');$('#dv').classList.toggle('act',tool!='none')}
function dl(){const v=$('#dv'),x=v.getContext('2d'),w=v.clientWidth,h=v.clientHeight,r=devicePixelRatio||1;x.setTransform(r,0,0,r,0,0);x.clearRect(0,0,w,h);x.lineWidth=2;x.lineCap=x.lineJoin='round';

let ns=null;$('#dv').addEventListener('pointerdown',e=>{if(tool=='none')return;busy=true;e.target.setPointerCapture(e.pointerId);if(tool=='pen'){ns={id:Date.now()+myId,u:myId,p:pt(e)};strokes.push(ns)}else er(e);dl()});
$('#dv').addEventListener('pointermove',e=>{if(!busy)return;if(tool=='pen'&&ns){ns.p.push(...pt(e))}else if(tool=='erase')er(e);dl()});

/* multiplayer */
let lp=0;function pres(x,y){if(!rm)return;try{rm.presence({n:prof.name,s:cur?cur.y:null,x:x??null,y:y??null})}catch(e){}}
